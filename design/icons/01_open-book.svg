<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 案1: 縦書きの見開き本 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a67"/><stop offset="1" stop-color="#1b2340"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 表紙の影 -->
  <path d="M84 140 Q256 110 428 140 L428 392 Q256 362 84 392 Z" fill="#0f1530" opacity="0.5" transform="translate(0,14)"/>
  <!-- ページ (左右) -->
  <path d="M84 140 Q170 118 256 150 L256 396 Q170 364 84 392 Z" fill="#f6f1e4"/>
  <path d="M428 140 Q342 118 256 150 L256 396 Q342 364 428 392 Z" fill="#fbf8ef"/>
  <!-- 縦書きの行 (右ページ→左ページの順) -->
  <g stroke="#2b3a67" stroke-width="12" stroke-linecap="round">
    <line x1="392" y1="178" x2="392" y2="352"/>
    <line x1="352" y1="170" x2="352" y2="300"/>
    <line x1="312" y1="166" x2="312" y2="340"/>
    <line x1="200" y1="166" x2="200" y2="330"/>
    <line x1="160" y1="170" x2="160" y2="290"/>
    <line x1="120" y1="178" x2="120" y2="340"/>
  </g>
  <!-- ルビ風の小さな点 -->
  <g fill="#c8102e">
    <circle cx="372" cy="190" r="6"/><circle cx="372" cy="214" r="6"/>
    <circle cx="180" cy="220" r="6"/><circle cx="180" cy="244" r="6"/>
  </g>
  <!-- のど (中央) -->
  <path d="M256 150 L256 396" stroke="#d9d2bf" stroke-width="6"/>
</svg>
