<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 案5: 和綴じ本 (題簽と綴じ糸) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f4"/><stop offset="1" stop-color="#d5dae5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 表紙 (紺) -->
  <rect x="112" y="72" width="288" height="368" rx="10" fill="#1e2a5a"/>
  <rect x="112" y="72" width="288" height="368" rx="10" fill="none" stroke="#141d40" stroke-width="6"/>
  <!-- 綴じ糸 (右端) -->
  <g stroke="#f2e9d0" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="372" y1="120" x2="372" y2="392"/>
    <line x1="372" y1="120" x2="400" y2="120"/>
    <line x1="372" y1="211" x2="400" y2="211"/>
    <line x1="372" y1="301" x2="400" y2="301"/>
    <line x1="372" y1="392" x2="400" y2="392"/>
  </g>
  <g fill="#f2e9d0">
    <circle cx="372" cy="120" r="9"/><circle cx="372" cy="211" r="9"/><circle cx="372" cy="301" r="9"/><circle cx="372" cy="392" r="9"/>
  </g>
  <!-- 題簽 (左上の白い短冊) -->
  <rect x="146" y="98" width="86" height="230" fill="#fbf7ea" stroke="#c9b98f" stroke-width="4"/>
  <g stroke="#1e2a5a" stroke-width="12" stroke-linecap="round">
    <line x1="189" y1="124" x2="189" y2="300"/>
  </g>
  <rect x="176" y="272" width="26" height="26" fill="#c8102e"/>
</svg>
